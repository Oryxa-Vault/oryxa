# opencode over the Agent Client Protocol.
#
# Unlike the Claude Code and Codex connectors beside this one, there is no
# adapter package here: opencode speaks ACP itself, as `opencode acp`. Nothing
# is fetched at launch and no version is pinned, because the protocol server
# ships in the binary — `brew upgrade opencode` is the whole story.
#
# ACP agents are local subprocesses, so this connector must be loaded from a
# trusted file — it cannot be registered through the runtime HTTP API.
#
# opencode needs a provider before it can answer: `opencode auth login`, once,
# outside the room. With no credential the lane starts and then fails on the
# first turn, which the room reports as lane.unavailable rather than silence.
#
# The agent writes in the room's workspace, which is the directory you ran the
# room view in unless something said otherwise. Run it somewhere you would not
# mind an agent editing.
name: opencode-local

acp:
  command: opencode
  args: [acp]
  # The room's workspace, which is where the agent may write.
  #
  # Resolved by the runtime, not read from the environment here: a room is
  # created with a directory, and everything in that room agrees on it.
  cwd: "{{workspace}}"
  env:
    # opencode is a Homebrew binary and shells out to ripgrep, which lives
    # beside it. Named rather than inherited for the same reason as the other
    # ACP connectors: a runtime launched by an editor gets the desktop's PATH,
    # which is rarely the one your shell has.
    PATH: "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"
    NO_BROWSER: "1"

    # The model this lane runs, pinned here rather than in the user's opencode
    # config so that joining a room does not change what `opencode` does in
    # their own terminal.
    #
    # x-preview-f-free is Ox Alpha: a stealth reasoning model, free during its
    # preview, with a 1M context. Two reasons it is the default rather than a
    # suggestion. The room's preamble, shared context and transcript are sent
    # every turn, so context is the resource a third agent spends fastest. And
    # it is from neither of the labs already in the room — which is the whole
    # point of a third seat, since agents that share a vendor share their blind
    # spots, and a room that agrees with itself has told you nothing.
    #
    # It is a preview: expect it to be withdrawn or renamed. When it is, any
    # id from `opencode models` works here, and removing this line falls back
    # to whatever opencode would have picked.
    OPENCODE_CONFIG_CONTENT: '{"model":"opencode/x-preview-f-free"}'

  # The same preamble the other two get. It is deliberately identical: an agent
  # that is told a different story about the room than its neighbours is the one
  # that answers as though it were alone.
  prompt: |
    This is a multiplayer room. The connected agents are {{agents}}, sharing one
    session and one context. You are {{agent}}.

    You cannot speak to them directly and you cannot see what they are saying
    while they say it — the lanes run at the same time. What reaches them is what
    you say here: it arrives in the room's notes below, on their next turn. So
    write for them as well as for the person, and expect their answer one turn
    later rather than immediately.

    Work with them, not beside them. Plan together, divide the work, say which
    part you are taking, and hand a part to whoever is better placed to do it.
    Read what the others have contributed before answering, never repeat work one
    of them has already done, and disagree out loud when you think one of them is
    wrong.

    Before starting anything substantial, put the plan in the room and let the
    others answer it. Saying it here is what shares it — a file in the workspace is
    not the room. Do not begin implementing while the plan is still being argued.

    When the room needs something from the person — a decision, a missing detail, a
    choice between two approaches — do not each ask them separately. Put the
    question in the room so the others can add to it, and have exactly one agent
    put the collected set to the person in a single message beginning APTQ. That agent is
    whoever the person addressed; if they addressed the room, it is the first name
    in {{agents}}. Everyone else waits for the answer rather than asking their own
    version of the same question.

    Everything below the line is what the room knows so far, contributed by the
    people and agents in it.

    ---

    {{context}}

    ---

    {{input}}

capabilities: [stream, multi_turn, cancel]
interests: [repo, codebase, bug, test, review, refactor, build]
timeout: 30m

# What this agent leaves behind for the rest of the room.
context:
  - key: findings
    from: $text
    last: true
