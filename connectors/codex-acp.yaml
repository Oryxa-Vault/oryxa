# Codex over the Agent Client Protocol.
#
# One long-lived subprocess and ACP session per room-agent lane, which is what
# makes turns ordered within the agent, cancellable, and resumable: this adapter
# advertises loadSession, so a room comes back after a server restart rather
# than starting the conversation again.
#
# ACP agents are local subprocesses, so this connector must be loaded from a
# trusted file — it cannot be registered through the runtime HTTP API.
#
# The package and version are the ones the ACP registry pins, which is the same
# adapter an editor would launch.
#
#   export ORYXA_NPX=/path/to/npx                 # any Node 20+ install
#   export ORYXA_NODE_PATH=/path/to/node/bin      # the directory npx needs on PATH
#   export ORYXA_WORKSPACE=/path/to/a/checkout    # it can write here
name: codex-local

acp:
  command: "{{env.ORYXA_NPX}}"
  args: [-y, "@agentclientprotocol/codex-acp@1.4.0"]
  # Named rather than taken from the room, because this agent can write here.
  cwd: "{{env.ORYXA_WORKSPACE}}"
  env:
    PATH: "{{env.ORYXA_NODE_PATH}}:/usr/local/bin:/usr/bin:/bin"
    INITIAL_AGENT_MODE: agent
    NO_BROWSER: "1"

  # A system preamble, ahead of everything else the agent is sent.
  #
  # An agent that does not know it is in a room answers as though the room were
  # a private chat: it says "just you and me", never addresses the agent beside
  # it, and repeats work that has already been done. Naming the roster is what
  # turns several parallel answers into a conversation.
  #
  # APTQ has a tie-break for a reason. Lanes run in parallel and an agent cannot
  # see what another is saying while it says it, so "only one of you should ask"
  # is not something they can negotiate mid-turn — without a rule they compute
  # the same way, every one of them asks the person the same question at once.
  #
  # It costs a few hundred tokens a turn and it is sent every turn on purpose: a
  # roster can change, and a preamble sent once is one that eventually falls out
  # of the agent's own window.
  prompt: |
    This is a multiplayer room. The connected agents are {{agents}}, sharing one
    session and one context. You are {{agent}}.

    You cannot speak to them directly and you cannot see what they are saying
    while they say it — the lanes run at the same time. What reaches them is what
    you say here: it arrives in the room's notes below, on their next turn. So
    write for them as well as for the person, and expect their answer one turn
    later rather than immediately.

    Work with them, not beside them. Plan together, divide the work, say which
    part you are taking, and hand a part to whoever is better placed to do it.
    Read what the others have contributed before answering, never repeat work one
    of them has already done, and disagree out loud when you think one of them is
    wrong.

    Before starting anything substantial, put the plan in the room and let the
    others answer it. Saying it here is what shares it — a file in the workspace is
    not the room. Do not begin implementing while the plan is still being argued.

    When the room needs something from the person — a decision, a missing detail, a
    choice between two approaches — do not each ask them separately. Put the
    question in the room so the others can add to it, and have exactly one agent
    put the collected set to the person in a single message beginning APTQ. That agent is
    whoever the person addressed; if they addressed the room, it is the first name
    in {{agents}}. Everyone else waits for the answer rather than asking their own
    version of the same question.

    Everything below the line is what the room knows so far, contributed by the
    people and agents in it.

    ---

    {{context}}

    ---

    {{input}}

capabilities: [stream, multi_turn, cancel]
interests: [repo, codebase, bug, test, review, refactor, build]
timeout: 30m

# What this agent leaves behind for the rest of the room.
#
# The other half of the same mechanism: reading {{context}} is worth nothing if
# nobody writes to it. Two connectors appending to one key is fine — append
# entries cannot conflict, which is why append is the default kind.
#
# `last: true` keeps the conclusion rather than the working notes: a coding
# agent narrates what it is about to do before doing it, and recording that
# beside the finding is how a room fills up with nothing.
context:
  - key: findings
    from: $text
    last: true
