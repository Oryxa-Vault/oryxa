# Local Codex integration over the Agent Client Protocol. The executable paths
# are supplied by the launcher so this trusted connector remains portable.
name: codex-local

acp:
  command: "{{env.ORYXA_PNPM}}"
  args: [dlx, "@agentclientprotocol/codex-acp@1.3.0"]
  cwd: "{{workspace}}"
  env:
    PATH: "{{env.ORYXA_NODE_PATH}}:/usr/bin:/bin"
    INITIAL_AGENT_MODE: agent
    NO_BROWSER: "1"

capabilities: [stream, multi_turn, cancel]
interests: [repo, codebase, bug, test, review, refactor, build]
timeout: 30m
