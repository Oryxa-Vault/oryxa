# Codex over the Agent Client Protocol.
#
# One long-lived subprocess and ACP session per room-agent lane, which is what
# makes turns ordered within the agent, cancellable, and resumable: this adapter
# advertises loadSession, so a room comes back after a server restart rather
# than starting the conversation again.
#
# ACP agents are local subprocesses, so this connector must be loaded from a
# trusted file — it cannot be registered through the runtime HTTP API.
#
# The package and version are the ones the ACP registry pins, which is the same
# adapter an editor would launch.
#
#   export ORYXA_NPX=/path/to/npx                 # any Node 20+ install
#   export ORYXA_NODE_PATH=/path/to/node/bin      # the directory npx needs on PATH
#   export ORYXA_WORKSPACE=/path/to/a/checkout    # it can write here
name: codex-local

acp:
  command: "{{env.ORYXA_NPX}}"
  args: [-y, "@agentclientprotocol/codex-acp@1.4.0"]
  # Named rather than taken from the room, because this agent can write here.
  cwd: "{{env.ORYXA_WORKSPACE}}"
  env:
    PATH: "{{env.ORYXA_NODE_PATH}}:/usr/local/bin:/usr/bin:/bin"
    INITIAL_AGENT_MODE: agent
    NO_BROWSER: "1"

  # A system preamble, ahead of everything else the agent is sent.
  #
  # An agent that does not know it is in a room answers as though the room were
  # a private chat: it says "just you and me", never addresses the agent beside
  # it, and repeats work that has already been done. Naming the roster is what
  # turns several parallel answers into a conversation.
  #
  # It costs about twenty tokens a turn, which is nothing beside the context
  # block underneath it, and it is sent every turn on purpose — a room's roster
  # can change, and a preamble sent once is a preamble that eventually falls out
  # of the agent's own window.
  prompt: |
    This is a multiplayer room. The connected agents are {{agents}}, sharing one
    session and one context. You are {{agent}}. Everything below the line is
    what the room knows so far, contributed by the people and agents in it —
    read it before answering, do not repeat work another agent has already
    done, and say so plainly when you disagree with one of them.

    ---

    {{context}}

    ---

    {{input}}

capabilities: [stream, multi_turn, cancel]
interests: [repo, codebase, bug, test, review, refactor, build]
timeout: 30m

# What this agent leaves behind for the rest of the room.
#
# The other half of the same mechanism: reading {{context}} is worth nothing if
# nobody writes to it. Two connectors appending to one key is fine — append
# entries cannot conflict, which is why append is the default kind.
#
# `last: true` keeps the conclusion rather than the working notes: a coding
# agent narrates what it is about to do before doing it, and recording that
# beside the finding is how a room fills up with nothing.
context:
  - key: findings
    from: $text
    last: true
