# Codex, through oryxa-shim — verified against codex-cli 0.147.0.
#
# The second command-line agent, and the one that proves the shim is not an
# adapter for a particular CLI: Codex names its own session where Claude Code
# accepts one, and resuming is a subcommand rather than a flag. Neither
# difference reaches this file, and neither needed a spec change.
#
#   oryxa-shim -agents shim.yaml       # then: oryxa check codex
#
# The stream, in the order it arrives:
#
#   {"type":"thread.started","thread_id":"019ff0ca-…"}
#   {"type":"turn.started"}
#   {"type":"item.completed","item":{"type":"agent_message","text":"…"}}
#   {"type":"turn.completed","usage":{…}}
#
# The gate is on the *item's* type, not the event's. `item.completed` is emitted
# for reasoning and command execution too, and all of them carry text — without
# the inner gate the room gets Codex's working notes as though they were its
# answer.
#
# Codex writes MCP connection failures to stderr as plain text. Those arrive
# wrapped by the shim and land as opaque activity, which is where they belong:
# visible when a turn goes wrong, never mistaken for the reply.
name: codex
base: http://{{env.ORYXA_SHIM_HOST}}:8090
timeout: 15m

# The shim's token, when it has one. Empty renders as a bearer with nothing after
# it, which a shim without a token ignores.
headers:
  Authorization: "Bearer {{env.ORYXA_SHIM_TOKEN}}"

capabilities: [stream, multi_turn]

interests: [repo, codebase, bug, stack trace, test, refactor, build, ci, regression]

open:
  method: POST
  path: /v1/agents/codex/open
  body:
    conversation: "{{conversation}}"
  capture:
    handle: $.handle

turn:
  method: POST
  path: /v1/agents/codex/turn
  body:
    handle: "{{handle}}"
    # The whole room. What the other agent found is the reason to be in one.
    input: |
      This is a multiplayer room. The connected agents are {{agents}}, sharing one
      session and one context. You are {{agent}}.

      You cannot speak to them directly and you cannot see what they are saying
      while they say it — the lanes run at the same time. What reaches them is what
      you say here: it arrives in the room's notes below, on their next turn. So
      write for them as well as for the person, and expect their answer one turn
      later rather than immediately.

      Work with them, not beside them. Plan together, divide the work, say which
      part you are taking, and hand a part to whoever is better placed to do it.
      Read what the others have contributed before answering, never repeat work one
      of them has already done, and disagree out loud when you think one of them is
      wrong.

      Before starting anything substantial, put the plan in the room and let the
      others answer it. Saying it here is what shares it — a file in the workspace is
      not the room. Do not begin implementing while the plan is still being argued.

      When the room needs something from the person — a decision, a missing detail, a
      choice between two approaches — do not each ask them separately. Put the
      question in the room so the others can add to it, and have exactly one agent
      put the collected set to the person in a single message beginning APTQ. That agent is
      whoever the person addressed; if they addressed the room, it is the first name
      in {{agents}}. Everyone else waits for the answer rather than asking their own
      version of the same question.

      Everything below the line is what the room knows so far, contributed by the
      people and agents in it.

      ---

      {{context}}

      ---

      {{input}}
  response:
    format: ndjson
    error: $.error
    when: $.item.type == agent_message
    text:
      - $.item.text
    # Codex sends whole messages, not token deltas — a preamble and then the
    # answer, as two complete sentences. Concatenated with nothing they run
    # together mid-sentence.
    join: "\n\n"

# Codex contributes to the same list Claude Code does, so the room accumulates
# findings rather than one agent's findings. Two rules on one key across two
# connectors is fine: append entries cannot conflict, which is why append is the
# default kind.
context:
  - key: findings
    from: $.item.text
    when: $.item.type == agent_message
    # Only the conclusion. Codex opens a turn by saying what it is about to do,
    # and without this that preamble is recorded as a finding beside the finding.
    last: true
