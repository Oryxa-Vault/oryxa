# Codex, through oryxa-shim — verified against codex-cli 0.147.0.
#
# The second command-line agent, and the one that proves the shim is not an
# adapter for a particular CLI: Codex names its own session where Claude Code
# accepts one, and resuming is a subcommand rather than a flag. Neither
# difference reaches this file, and neither needed a spec change.
#
#   oryxa-shim -agents shim.yaml       # then: oryxa check codex
#
# The stream, in the order it arrives:
#
#   {"type":"thread.started","thread_id":"019ff0ca-…"}
#   {"type":"turn.started"}
#   {"type":"item.completed","item":{"type":"agent_message","text":"…"}}
#   {"type":"turn.completed","usage":{…}}
#
# The gate is on the *item's* type, not the event's. `item.completed` is emitted
# for reasoning and command execution too, and all of them carry text — without
# the inner gate the room gets Codex's working notes as though they were its
# answer.
#
# Codex writes MCP connection failures to stderr as plain text. Those arrive
# wrapped by the shim and land as opaque activity, which is where they belong:
# visible when a turn goes wrong, never mistaken for the reply.
name: codex
base: http://{{env.ORYXA_SHIM_HOST}}:8090
timeout: 15m

capabilities: [stream, multi_turn]

interests: [repo, codebase, bug, stack trace, test, refactor, build, ci, regression]

open:
  method: POST
  path: /v1/agents/codex/open
  body:
    conversation: "{{conversation}}"
  capture:
    handle: $.handle

turn:
  method: POST
  path: /v1/agents/codex/turn
  body:
    handle: "{{handle}}"
    input: "{{context.pinned}}\n\n{{input}}"
  response:
    format: ndjson
    error: $.error
    when: $.item.type == agent_message
    text:
      - $.item.text
