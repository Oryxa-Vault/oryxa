# Claude Code, through oryxa-shim — verified against 2.1.208.
#
# A command-line agent rather than a framework server, which is the point: it
# reaches Oryxa with no new spec feature, the same way AG-UI did. What made that
# possible is that the shim passes the CLI's own NDJSON through untouched, so
# this file is an ordinary connector reading an ordinary stream.
#
#   oryxa-shim -agents shim.yaml       # then: oryxa check claude-code
#
# The stream, in the order it arrives:
#
#   {"type":"system","subtype":"init","session_id":"…","tools":[…]}
#   {"type":"assistant","message":{"content":[{"type":"text","text":"…"}]}}
#   {"type":"result","subtype":"success","result":"…","total_cost_usd":…}
#
# `content[*].text` needs no predicate to skip thinking and tool_use blocks:
# they carry no `text` key, so the selector simply does not match them. Tool
# calls, results and the shim's own stderr lines all land as opaque activity.
name: claude-code
base: http://{{env.ORYXA_SHIM_HOST}}:8090
timeout: 15m

# The shim's token, when it has one. Unset this renders as an empty bearer, and a
# shim with no token ignores it — so the same file works on a laptop and behind a
# shared port.
#
# Without this the shim can be given a token and nothing can then reach it, which
# is a server that starts, looks healthy, and fails every turn with a 401 that
# names neither side.
headers:
  Authorization: "Bearer {{env.ORYXA_SHIM_TOKEN}}"

capabilities: [stream, multi_turn]

interests: [repo, codebase, bug, stack trace, test, refactor, build, ci, regression]

open:
  method: POST
  path: /v1/agents/claude-code/open
  body:
    conversation: "{{conversation}}"
  capture:
    handle: $.handle

turn:
  method: POST
  path: /v1/agents/claude-code/turn
  body:
    handle: "{{handle}}"
    # The whole room, not just the pinned set. What the other agent found is the
    # reason to be in a room at all, and an append list is bounded where it is
    # rendered rather than where it is stored — so this grows to a limit and then
    # stops, and `-summariser` decides whether what fell off is said or counted.
    input: |
      This is a multiplayer room. The connected agents are {{agents}}, sharing one
      session and one context. You are {{agent}}.

      You cannot speak to them directly and you cannot see what they are saying
      while they say it — the lanes run at the same time. What reaches them is what
      you say here: it arrives in the room's notes below, on their next turn. So
      write for them as well as for the person, and expect their answer one turn
      later rather than immediately.

      Work with them, not beside them. Plan together, divide the work, say which
      part you are taking, and hand a part to whoever is better placed to do it.
      Read what the others have contributed before answering, never repeat work one
      of them has already done, and disagree out loud when you think one of them is
      wrong.

      Before starting anything substantial, put the plan in the room and let the
      others answer it. Saying it here is what shares it — a file in the workspace is
      not the room. Do not begin implementing while the plan is still being argued.

      When the room needs something from the person — a decision, a missing detail, a
      choice between two approaches — do not each ask them separately. Put the
      question in the room so the others can add to it, and have exactly one agent
      put the collected set to the person in a single message beginning APTQ. That agent is
      whoever the person addressed; if they addressed the room, it is the first name
      in {{agents}}. Everyone else waits for the answer rather than asking their own
      version of the same question.

      Everything below the line is what the room knows so far, contributed by the
      people and agents in it.

      ---

      {{context}}

      ---

      {{input}}
  response:
    format: ndjson
    # Checked before the `when` gate, so this catches a failure on any line —
    # the CLI's own errors and the shim's alike.
    error: $.error
    when: $.type == assistant
    text:
      - $.message.content[*].text
    # Whole messages rather than token deltas: the CLI sends one assistant event
    # per block, so without a separator two sentences run together.
    join: "\n\n"

# What this agent leaves behind for the rest of the room.
#
# `result` rather than `$text`: the CLI ends every turn with one event carrying
# the finished answer, where $text is everything it said along the way —
# including the "I'll check the README" it says before checking the README.
# A named field cannot drift the way the running transcript can.
#
# Not pinned. Pinning is the curated set that goes in front of every agent on
# every turn, and a coding agent's answer is long enough that pinning each one
# would crowd out whatever was actually worth keeping.
context:
  - key: findings
    from: $.result
    when: $.type == result
