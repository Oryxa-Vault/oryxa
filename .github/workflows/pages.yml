# Publishes site/ to GitHub Pages.
#
# No CNAME file, deliberately. oryxa.in already serves a different site, and a
# CNAME here would claim that name for Pages the moment this runs. The install
# URL reaches this build through a redirect at the edge instead, which is why
# install.sh must keep working when it is fetched under another hostname — it
# does, because everything it downloads comes from the GitHub release, not from
# wherever the script itself was served.
#
# The recording lives once, in docs/media/, because the README points at it there
# and a second copy in site/ would be the one that goes stale. It is copied into
# the build output instead.
#
# install.sh is copied the same way and for the same reason: the URL people are
# told to curl is this site, and the script they get must be the one in the repo
# that changes with it.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/media/**'
      - 'install.sh'
      - 'openapi.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run should wait for the one in flight rather than cancel it: a
# half-published site is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/media
          cp -R site/. _site/
          cp docs/media/room.gif _site/media/room.gif
          cp install.sh _site/install.sh
          cp openapi.yaml _site/openapi.yaml

      - name: The installer is valid shell
        run: sh -n _site/install.sh

      - name: Check the page references files that exist
        run: |
          for f in 404.html og.png media/room.gif install.sh robots.txt sitemap.xml llms.txt llms-full.txt openapi.yaml; do
            test -f "_site/$f" || { echo "missing: $f"; exit 1; }
          done

      - name: Check search and agent discovery metadata
        run: |
          grep -q '<link rel="canonical" href="https://oryxa.in/">' _site/index.html
          grep -q 'application/ld+json' _site/index.html
          grep -q 'Sitemap: https://oryxa.in/sitemap.xml' _site/robots.txt
          grep -q '<loc>https://oryxa.in/</loc>' _site/sitemap.xml
          grep -q 'https://oryxa.in/openapi.yaml' _site/llms.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
