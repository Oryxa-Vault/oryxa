# Builds the binaries install.sh downloads.
#
# The asset names are the contract: install.sh works out a Rust target triple
# from `uname` and asks for `oryxa-<tag>-<triple>.tar.gz`. Renaming anything
# here breaks every future install, so the names are not incidental.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      # One target failing should not hide whether the others built: a partial
      # matrix tells us which platform is broken, an aborted one does not.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          # musl, so the binary carries its own libc. A glibc build made on the
          # runner refuses to start on any distribution older than the runner,
          # which is a bug report that arrives long after the release.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # A binary that reports a version it is not is worse than no version at
      # all, and it is only ever noticed from a bug report.
      - name: The tag and Cargo.toml agree
        shell: bash
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$crate" != "$TAG" ]; then
            echo "Cargo.toml says $crate, the tag says $TAG"
            exit 1
          fi

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - name: Install the musl C toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo +stable build --release --locked --bin oryxa --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          tar -czf "oryxa-$TAG-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" oryxa

      - uses: actions/upload-artifact@v4
        with:
          name: oryxa-${{ matrix.target }}
          path: oryxa-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # install.sh refuses to install anything it cannot check against this
      # file, so the release is not usable without it.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum oryxa-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
