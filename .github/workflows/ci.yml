name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The postgres store is the durability guarantee; testing it against a real
    # server is the only way that guarantee means anything.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oryxa
          POSTGRES_PASSWORD: oryxa
          POSTGRES_DB: oryxa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oryxa"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      ORYXA_TEST_DATABASE_URL: postgres://oryxa:oryxa@127.0.0.1:5432/oryxa?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: rustfmt
        run: cargo +stable fmt --all --check

      - name: Rust build and test
        run: cargo +stable test --locked --all-targets

      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings

      - name: The installer is valid shell
        run: sh -n install.sh

      # The core must never branch on which framework it is talking to.
      #
      # Comments are exempt on purpose: several of them name a framework to
      # explain why a feature exists (ADK's thought flag, AG-UI's typed events),
      # and that reasoning is worth keeping. Tests are exempt because their
      # fixtures replay real payloads — in Rust those are inline `#[cfg(test)]`
      # modules at the end of a file, so the file is read up to that point.
      #
      # The coding agents are in the list for the same reason as the frameworks.
      # The day the core needs a special case for one of them, the connector
      # format is wrong.
      - name: no framework names in core code
        run: |
          fail=0
          names="langgraph|crewai|pydantic|ag-ui|\badk\b|claude|codex"
          for f in $(find src -name '*.rs'); do
            hits=$(sed -e '/#\[cfg(test)\]/,$d' -e 's://.*::' "$f" | grep -inE "$names" || true)
            if [ -n "$hits" ]; then
              echo "$hits" | sed "s|^|$f:|"
              fail=1
            fi
          done
          if [ "$fail" = 1 ]; then
            echo "framework name in core code; that belongs in a connector"
            exit 1
          fi
          echo "core is framework-agnostic"

      # load_dir validates every file in the directory, so listing the agents
      # in one is enough to prove they all parse: a malformed file fails the
      # load and takes the command with it.
      - name: every shipped connector and template parses
        run: |
          for dir in connectors connectors/templates; do
            echo "  $dir"
            cargo +stable run --locked --quiet --bin oryxa -- agents --connectors "$dir"
          done
