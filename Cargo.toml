[package]
name = "oryxa"
version = "0.5.2"
edition = "2024"
license = "Apache-2.0"
description = "Multiplayer AI — many people and many agents in one room, live"
repository = "https://github.com/Oryxa-Vault/oryxa"

[lib]
name = "oryxa"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
agent-client-protocol = "2.0.0"
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
rand = "0.8"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["trace"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color"] }
unicode-width = "0.2.2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
