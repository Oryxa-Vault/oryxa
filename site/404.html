<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#f7f7f5">
  <title>Page not found — Oryxa</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f7f7f5; color: #1d1d1b; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(calc(100% - 40px), 760px); padding: 64px 0; }
    .eyebrow { color: #8c8c89; font-size: 10px; font-weight: 600; letter-spacing: .33em; text-transform: uppercase; }
    h1 { max-width: 650px; margin: 20px 0 0; font-size: clamp(48px, 8vw, 88px); font-weight: 400; letter-spacing: -.065em; line-height: .98; }
    h1 span { color: #8c8c89; }
    p { max-width: 520px; margin: 28px 0 0; color: #666663; font-size: 18px; line-height: 1.45; }
    a { display: inline-flex; margin-top: 32px; min-height: 44px; align-items: center; padding: 0 18px; border: 1px solid #1d1d1b; background: #1d1d1b; color: #fff; font-size: 13px; text-decoration: none; }
    a:focus-visible { outline: 2px solid #1d1d1b; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">404 · Room not found</div>
    <h1>This page left the room.<br><span>Oryxa is still here.</span></h1>
    <p>The address may have changed. Return to the Oryxa overview for the current product, documentation and install path.</p>
    <a href="/">Return to Oryxa</a>
  </main>
</body>
</html>
