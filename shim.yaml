# Command-line agents, for oryxa-shim.
#
#   oryxa-shim -agents shim.yaml
#
# This file decides what may run on this machine. Nothing here can be set over
# HTTP — that is the whole reason the shim is a separate process from the server.
#
# `first` and `resume` are complete command lines. Repetitive on purpose:
# resuming a conversation is a flag on one CLI and a subcommand on another, and
# a scheme clever enough to express both is a scheme that breaks on the third.
#
# Templating is the connector language, so `{{input}}` and `{{handle}}` mean here
# what they mean there. A command with no `{{input}}` gets the prompt on stdin,
# which is where a long one belongs anyway.

agents:
  # Claude Code — verified against 2.1.208.
  #
  # Emits NDJSON: a `system`/`init` line, `assistant` lines carrying the answer,
  # a final `result`. The session id is ours to choose, so `session: generate`
  # names it up front and every later turn resumes it.
  - name: claude-code
    dir: .
    timeout: 15m
    session: generate

    # READ-ONLY BY DEFAULT, and this is the line to think hardest about before
    # changing. Anyone who can talk to the room can make this agent act. An
    # allowlist is a stronger boundary than a permission mode, because it cannot
    # be prompted around: with no Edit, Write or Bash, no wording gets a file
    # changed. Widen it when you have read-scoping and trust everyone in the
    # room, not before.
    first:
      - claude
      - -p
      - --output-format
      - stream-json
      - --verbose
      - --tools
      - Read,Grep,Glob
      - --session-id
      - "{{handle}}"
    resume:
      - claude
      - -p
      - --output-format
      - stream-json
      - --verbose
      - --tools
      - Read,Grep,Glob
      - --resume
      - "{{handle}}"

  # Codex — verified against codex-cli 0.147.0.
  #
  # Codex mints its own id and announces it as `thread_id` on the first event,
  # so this is `session: capture` rather than generate. If Codex answers the
  # first message and then behaves as though every turn is its first, this
  # selector is the thing to check.
  #
  # `-s workspace-write` lets Codex write inside this directory, and this is the
  # line to think about before copying this file.
  #
  # It is here because read-only made it a worse colleague than it needed to be:
  # asked what was wrong with this repo it found a real crash — a send on a
  # closed channel in the event fan-out — and had to report it as a suspicion,
  # because `go test` could not create its build directory. Verification is most
  # of what a coding agent is for, and it cannot verify anything it cannot run.
  #
  # What it costs: anyone who can reach a room holding this agent can cause writes
  # to this directory. That is a bigger blast radius than the token was ever
  # guarding, so it belongs on a checkout you can throw away rather than the one
  # you are working in. `claude-code` above stays read-only deliberately — one
  # agent that can run the tests and one that cannot is a useful pair, and it
  # keeps the safer shape in front of anyone reading this file.
  #
  # Writes are confined to this directory and temp. Codex still could not reach
  # a credential in $HOME even if asked to.
  #
  # The two command lines differ by more than a flag, which is the case that
  # made `first` and `resume` complete argv rather than a base plus extras.
  # `resume` is a subcommand that takes the id as a positional, and it rejects
  # `-s` outright — the sandbox has to arrive as a config override instead.
  - name: codex
    dir: .
    timeout: 15m
    session: capture
    capture: $.thread_id
    first:
      - codex
      - exec
      - --json
      - -s
      - workspace-write
      - --skip-git-repo-check
      - "{{input}}"
    resume:
      - codex
      - exec
      - resume
      - "{{handle}}"
      - --json
      - --skip-git-repo-check
      - -c
      - sandbox_mode=workspace-write
      - "{{input}}"
